<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>跳转中...</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>
<script>
const baseUrl = "https://4f7a1992.r11.vip.cpolar.cn";
const urlParams = new URLSearchParams(window.location.search);
const pathRaw = urlParams.get('path') || '';
const path = decodeURIComponent(pathRaw);

const targetUrl = baseUrl + path;

const metaRefresh = document.createElement('meta');
metaRefresh.httpEquiv = "refresh";
metaRefresh.content = `0;url=${targetUrl}`;
document.head.appendChild(metaRefresh);
window.location.href = targetUrl;
</script>
<p>如果没有自动跳转，请 <a id="jumpLink">点击这里</a></p>
<script>
document.getElementById("jumpLink").href = targetUrl;
</script>
</body>
</html>
