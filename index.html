<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>跳转中...</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
</head>
<body>
<script>
    var baseUrl = "https://239779f4.r11.vip.cpolar.cn";
    var urlParams = new URLSearchParams(window.location.search);
    var pathRaw = urlParams.get('path') || '';
    var path = decodeURIComponent(pathRaw);
    var targetUrl = baseUrl + path;
    window.location.replace(targetUrl);
</script>
<p>如果没有自动跳转，请 <a id="jumpLink">点击这里</a></p>
<script>
    document.getElementById("jumpLink").href = targetUrl;
</script>
</body>
</html>
